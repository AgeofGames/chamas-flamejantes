<div class="table-wrap"><table class="players-table standings-table"><thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>D</th><th>Pontos</th></tr></thead><tbody>{% for s in standings %}<tr><td class="rank">{{ s.position }}</td><td><strong>{{ s.entry.display_name }}</strong></td><td>{{ s.played }}</td><td class="win-cell">{{ s.wins }}</td><td>{{ s.losses }}</td><td><strong>{{ s.points }}</strong></td></tr>{% endfor %}</tbody></table></div>
